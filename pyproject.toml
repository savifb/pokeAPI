[project]
name = "virtualpokeapi"
version = "1.0"
description = "Ambiente virtual para desenvolvimento de api que faz requisições a api POKEAPI e lista e estrutura-a de forma organizada e paginada, adicionando também em cache."
authors = [
    {name = "savifb",email = "savio.sousa@estudante.ifb.edu.br"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "redis (>=7.2.1,<8.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pylance (>=2.0.1,<3.0.0)",
    "sqlmodel (>=0.0.37,<0.0.38)",
    "sqlalchemy-orm (>=1.2.10,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
